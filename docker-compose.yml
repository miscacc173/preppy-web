services:
  app:
    build: .
    ports: [ "8000:80" ]
    env_file: .env
    depends_on: [ postgres ]
    volumes: [ ".:/var/www/html" ]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ai_exam_prep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: [ "5432:5432" ]
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
volumes:
  postgres_data:
